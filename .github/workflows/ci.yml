name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: 30.0.1

jobs:
  check:
    name: fmt, clippy, test, wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (unit + integration against OZ account wasm fixture)
        run: cargo test --workspace

      - name: Check SECURITY.md test references
        run: node scripts/check-security-tests.mjs

      - name: Verify test fixture hashes match SPEC.md
        run: sha256sum -c tests/fixtures/SHA256SUMS

      - name: Cache stellar-cli
        id: stellar-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ runner.os }}-${{ env.STELLAR_CLI_VERSION }}

      - name: Install stellar-cli
        if: steps.stellar-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli@${STELLAR_CLI_VERSION} --no-default-features

      - name: Build contract WASMs
        run: |
          stellar contract build
          ls -lh target/wasm32v1-none/release/fosay_mandate_policy.wasm
          ls -lh target/wasm32v1-none/release/fosay_approvals.wasm

name: Release

# Adding .github/release-notes/<tag>.md to main publishes that release: the tag is created
# on the pushed commit and the file becomes the release notes. Tags containing "-" (such as
# v0.1.0-testnet) are marked as pre-releases. Pushing a v* tag by hand also works.
on:
  push:
    branches: [main]
    paths: ['.github/release-notes/**', '.github/workflows/release.yml']
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tags="${GITHUB_REF_NAME}"; else
            tags=$(ls .github/release-notes/*.md 2>/dev/null | xargs -n1 basename | sed 's/\.md$//')
          fi
          for tag in $tags; do
            if gh release view "$tag" >/dev/null 2>&1; then echo "exists: $tag"; continue; fi
            notes=".github/release-notes/${tag}.md"
            args=(--title "$tag" --target "$GITHUB_SHA")
            if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
            case "$tag" in *-*) args+=(--prerelease);; esac
            gh release create "$tag" "${args[@]}"
            echo "released: $tag"
          done

name: Release

# Pushing a tag v* publishes a GitHub Release with the notes in
# .github/release-notes/<tag>.md (falls back to generated notes).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          if [ -f "$notes" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$notes" $pre --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --generate-notes $pre --verify-tag
          fi
